# HeartStone login theme (tenant-neutral). Extends Keycloak's keycloak.v2 (PatternFly 5) theme.
# A government-specific theme (for example ../../heartstone-absez) sets parent=heartstone and
# overrides only the hs* properties, images and messages that differ.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/heartstone.css

# Name shown in the page title, header (when there is no logo) and official-service statement.
hsTenantName=${env.HEARTSTONE_TENANT_NAME:}
# "true" shows the development-build banner on every page. Production sets HEARTSTONE_DEV_BANNER=false.
hsDevBanner=${env.HEARTSTONE_DEV_BANNER:true}
# Header logo (path under this theme's resources) and its text alternative. Empty: tenant name as text.
hsLogo=
hsLogoAlt=
hsFavicon=
