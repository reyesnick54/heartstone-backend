# HeartStone email wording. Keycloak keys are overridden here; keys starting with "hs" are
# HeartStone's own. Java MessageFormat: write '' for an apostrophe, {0} for a value.
emailVerificationSubject=Confirm your email address for your digital ID
passwordResetSubject=Reset the password for your digital ID

hsDevBannerTitle=Development build
hsDevBannerBody=do not use real personal information. This message comes from a test system.
hsEmailFooter=This email was sent by the {0}. Government staff will never ask you for your password. Do not reply to this email.
hsEmailLinkFallback=If the button does not work, copy this link into your browser:
hsEmailLinkExpiry=This link expires in {0}.
hsEmailVerificationIntro=Please confirm that this email address is yours so that you can use your {0} digital ID.
hsEmailVerificationAction=Confirm my email address
hsEmailVerificationBasic=Your digital ID is a basic account: it lets you sign in and start services online. Some services will ask you to confirm your identity later.
hsEmailVerificationIgnore=If you did not create a digital ID, you can ignore this email. Without confirmation, nobody can use this email address to sign in.
hsPasswordResetIntro=Someone asked to reset the password for your {0} digital ID. If this was you, choose a new password.
hsPasswordResetAction=Choose a new password
hsPasswordResetIgnore=If you did not ask for this, you can ignore this email. Your password will not change.
