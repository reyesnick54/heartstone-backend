# HeartStone email theme (tenant-neutral). A government-specific theme sets parent=heartstone and
# overrides the hs* properties below.
parent=base

# Name used as the sender brand in every email.
hsTenantName=${env.HEARTSTONE_TENANT_NAME:}
# "true" adds the development-build warning to every email. Production sets HEARTSTONE_DEV_BANNER=false.
hsDevBanner=${env.HEARTSTONE_DEV_BANNER:true}
