services:
  heartstone-postgres:
    image: postgres:16-alpine
    container_name: heartstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heartstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartstone_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-heartstone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - heartstone-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heartstone} -d ${POSTGRES_DB:-heartstone}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  heartstone-redis:
    image: redis:7-alpine
    container_name: heartstone-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - heartstone-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  heartstone-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heartstone-api
    restart: unless-stopped
    depends_on:
      heartstone-postgres:
        condition: service_healthy
      heartstone-redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_NAME: ${APP_NAME:-heartstone-backend}
      API_VERSION: ${API_VERSION:-v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-heartstone}:${POSTGRES_PASSWORD:-heartstone_dev_password}@heartstone-postgres:5432/${POSTGRES_DB:-heartstone}?schema=public
      REDIS_HOST: heartstone-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-false}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-100kb}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  heartstone-postgres-data:
  heartstone-redis-data:
