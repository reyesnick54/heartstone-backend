name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NPM_AUDIT_SEVERITY_THRESHOLD: critical
  DATABASE_URL: postgresql://heartstone:heartstone@localhost:5432/heartstone?schema=public
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  REDIS_DB: '0'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Secret scanning
        run: npm run security:scan-secrets

      - name: Dependency vulnerability policy
        run: npm run security:audit-dependencies
      - name: Compute artifact digest
        id: artifact
        run: |
          DIGEST=$(find dist -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$DIGEST" >> "$GITHUB_ENV"

      - name: Record build provenance
        run: |
          cat > build-provenance.json <<EOF
          {
            "sourceCommitSha": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}",
            "artifactDigest": "${{ env.artifact_digest }}",
            "lockfileDigest": "$(sha256sum package-lock.json | awk '{print $1}')",
            "nodeVersion": "${{ env.NODE_VERSION }}",
            "authorizesProduction": false
          }
          EOF
          cat build-provenance.json

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heartstone
          POSTGRES_PASSWORD: heartstone
          POSTGRES_DB: heartstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartstone -d heartstone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      HEARTSTONE_ENVIRONMENT_CLASSIFICATION: TEST
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Migration dry-run validation
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Security tests
        run: npm run test:unit -- --testPathPattern=phase-13e
