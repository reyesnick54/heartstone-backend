name: Resolve S5 merge conflicts

on:
  push:
    branches:
      - cursor/s5-route-classification-ccfd

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://heartstone:heartstone@localhost:5432/heartstone?schema=public
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  REDIS_DB: '0'

jobs:
  resolve-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heartstone
          POSTGRES_PASSWORD: heartstone
          POSTGRES_DB: heartstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartstone -d heartstone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout S5 branch
        uses: actions/checkout@v4
        with:
          ref: cursor/s5-route-classification-ccfd
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge current main preserving newer hardening
        run: |
          git fetch origin main
          set +e
          git merge --no-ff --no-commit -X theirs origin/main
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if git ls-files -u -- "$file" | awk '$3 == 3 { found=1 } END { exit !found }'; then
                git checkout --theirs -- "$file"
                git add "$file"
              else
                git rm -f -- "$file"
              fi
            done <<< "$unresolved"
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            echo "$remaining"
            exit 1
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts, but all were resolved in favor of current main where required."
          fi


      - name: Restore S5 manifest generator after merge
        run: |
          git checkout HEAD -- scripts/generate-protected-route-manifest.ts
          git add scripts/generate-protected-route-manifest.ts


      - name: Restore S5 consequential controller coverage after merge
        run: |
          git checkout HEAD -- \
            src/customs-trade/customs-trade.controller.ts \
            src/evidence/evidence.controller.ts \
            src/healthcare/research/clinical-research.controller.ts \
            src/labour/labour.controller.ts \
            src/operational-readiness/operational-readiness.controller.ts \
            src/revenue/revenue.controller.ts \
            src/social-protection/social-protection.controller.ts
          git add \
            src/customs-trade/customs-trade.controller.ts \
            src/evidence/evidence.controller.ts \
            src/healthcare/research/clinical-research.controller.ts \
            src/labour/labour.controller.ts \
            src/operational-readiness/operational-readiness.controller.ts \
            src/revenue/revenue.controller.ts \
            src/social-protection/social-protection.controller.ts


      - name: Repair inherited S1 test syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'test/remediation-s1-server-derived-authority.must-fail.e2e-spec.ts';
          let s = fs.readFileSync(file, 'utf8');
          const bad = "    const packetItems = await prisma.evidencePacketItem.findMany({\n    let packetItems = await prisma.evidencePacketItem.findMany({";
          const good = "    let packetItems = await prisma.evidencePacketItem.findMany({";
          if (!s.includes(bad)) {
            throw new Error('Expected inherited duplicate packetItems syntax was not found');
          }
          s = s.replace(bad, good);
          fs.writeFileSync(file, s);
          NODE
          git add test/remediation-s1-server-derived-authority.must-fail.e2e-spec.ts


      - name: Repair inherited consequential guard test syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'test/consequential-action-guard.must-fail.e2e-spec.ts';
          let s = fs.readFileSync(file, 'utf8');
          const start = s.indexOf('  function sessionContext(');
          const marker = "  it('authenticated official with no authority cannot approve'";
          const end = s.indexOf(marker, start);
          if (start < 0 || end < 0) {
            throw new Error('Expected corrupted sessionContext/assertBlocked section was not found');
          }
          const good = "  async function sessionContext(identityId: string, userAccountId?: string | null) {\n    const existing = await prisma.session.findFirst({\n      where: { identityId, status: 'ACTIVE' },\n      orderBy: { issuedAt: 'desc' },\n    });\n    const session =\n      existing ??\n      (await prisma.session.create({\n        data: {\n          identityId,\n          userAccountId: userAccountId ?? null,\n          tokenHash: hashToken(`cag-session-${identityId}-${String(Date.now())}`),\n          status: 'ACTIVE',\n          assuranceLevel: 'HIGH',\n          expiresAt: new Date('2099-01-01'),\n        },\n      }));\n\n    return {\n      sessionId: session.id,\n      identityId: session.identityId,\n      userAccountId: session.userAccountId,\n      assuranceLevel: session.assuranceLevel,\n    };\n  }\n\n  async function assertBlocked(\n    identityId: string,\n    body: Record<string, unknown>,\n    expectedCodes: string[],\n  ) {\n    try {\n      await consequentialActionService.assertConsequentialActionAllowed(\n        await sessionContext(identityId),\n        {\n          action: AuthorityActionType.APPROVE,\n          functionAuthorityRecordId: body.functionAuthorityRecordId as string,\n          requireHumanActor: true,\n        },\n        { body },\n      );\n      throw new Error('Expected consequential action to be blocked');\n    } catch (error) {\n      const blocked =\n        error instanceof ForbiddenException || error instanceof UnauthorizedException;\n      expect(blocked).toBe(true);\n      if (error instanceof UnauthorizedException) {\n        return;\n      }\n      const response = (error as ForbiddenException).getResponse() as ConsequentialActionDenial;\n      for (const code of expectedCodes) {\n        expect(response.explanationCodes).toContain(code);\n      }\n      expect(response.outcome).not.toBe(AuthorityEvaluationOutcome.ALLOW);\n      expect(response.evaluationId).toBeDefined();\n    }\n  }\n\n";
          s = s.slice(0, start) + good + s.slice(end);
          fs.writeFileSync(file, s);
          NODE
          git add test/consequential-action-guard.must-fail.e2e-spec.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Re-apply S5 controller route metadata to current main
        run: npx ts-node scripts/apply-controller-route-access.ts

      - name: Ensure S5 validation script is registered
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts = p.scripts || {};
          p.scripts['security:validate-routes'] = 'jest --runInBand src/security/route-security-metadata.spec.ts';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Regenerate protected route manifest
        run: npm run security:manifest

      - name: Format touched TypeScript
        run: npm run format

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: S5 route security validation
        run: npm run security:validate-routes

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Remove temporary resolver files
        run: |
          git rm .github/workflows/s5-conflict-resolution.yml
          git rm -f .github/s5-resolver-trigger.txt || true

      - name: Commit resolved branch
        run: |
          git add -A
          git commit -m "merge main into S5 and resolve route security conflicts"
          git push origin HEAD:cursor/s5-route-classification-ccfd
